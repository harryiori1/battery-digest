name: Daily Battery Digest

on:
  schedule:
    # Run at 7 AM CDT (12:00 UTC) - 1 hour before email goes out
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit generated digests back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Main site ---
      - name: Scrape news (main)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/scrape.py

      - name: Curate digest (main)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/curate.py

      - name: Build site (main)
        run: python build.py

      - name: Deploy main site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.81.1'

      # --- Solid State site ---
      - name: Scrape news (solidstate)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/scrape.py --site solidstate

      - name: Curate digest (solidstate)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/curate.py --site solidstate

      - name: Build site (solidstate)
        run: python build.py --site solidstate

      - name: Deploy solidstate site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.81.1'
          command: deploy --config wrangler-solidstate.jsonc

      # --- Persist today's digests ---
      # Without this, a digest only exists in the runner and vanishes from the
      # site on the next deploy. Runs even if an earlier step failed so partial
      # results (e.g. main succeeded, solidstate failed) are still saved.
      - name: Commit new digests
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/digests/ content/digests-solidstate/
          if git diff --cached --quiet; then
            echo "No new digests to commit"
            exit 0
          fi
          git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
